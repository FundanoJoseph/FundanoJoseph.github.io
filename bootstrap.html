<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Navbar & Carousel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="bootstrap.css">
</head>
<body>

    <div class="container mt-3 mb-3">
        <a href="joseph.html" class="btn btn-dark me-2">Personal Website</a>
        <a href="abc.html" class="btn btn-dark me-2">KFC Landing Page</a>
        <a href="Navimenu.html" class="btn btn-dark me-2">Navigation Menu</a>
        <a href="simple website.html" class="btn btn-dark">Simple Website</a>
    </div>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">MyWebsite</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Gallery</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div id="myCarousel" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-inner">

            <div class="carousel-item active">
                <img src="bootstrap pic 1.jpg" class="d-block w-100" alt="Picture 1">
                <div class="carousel-caption">
                    <h5>First Slide</h5>
                </div>
            </div>

            <div class="carousel-item">
                <img src="bootstrap pic 2.jpg" class="d-block w-100" alt="Picture 2">
                <div class="carousel-caption">
                    <h5>Second Slide</h5>
                </div>
            </div>

            <div class="carousel-item">
                <img src="bootstrap pic 3.jpg" class="d-block w-100" alt="Picture 3">
                <div class="carousel-caption">
                    <h5>Third Slide</h5>
                </div>
            </div>

        </div>

        <button class="carousel-control-prev" type="button" data-bs-target="#myCarousel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </button>

        <button class="carousel-control-next" type="button" data-bs-target="#myCarousel" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
        </button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
